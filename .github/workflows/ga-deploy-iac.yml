name: Deploy-IAC

on:
  push:
    branches:
      - devy
    paths-ignore:
      - '*'
  pull_request:
    branches:
      - devy
  workflow_dispatch: 



jobs:
  check-bicep:
    name: Check Bicep Syntax
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1



      - name: Install Bicep CLI
        run: |
          curl -Lo bicep https://github.com/Azure/bicep/releases/latest/download/bicep-linux-x64
          chmod +x ./bicep
          sudo mv ./bicep /usr/local/bin/bicep

      - name: Validate Bicep Syntax
        run: bicep build ./iac-adb-360/main.bicep

  validate-bicep:
    name: Validate Bicep Against Azure
    needs: check-bicep
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Login to Azure
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3.0.1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Validate Bicep Template
        run: |
          az deployment group validate \
            --resource-group ${{ vars.RESOURCE_GROUP }}\
            --template-file ./iac-adb-360/main.bicep \
            --parameters baseName=${{ vars.BASE_NAME }} env=${{ github.ref_name }}


  deploy-bicep:
    name: deploy
    needs: validate-bicep
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Login to Azure
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3.0.1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: deploy Bicep Template
        run: |
          az deployment group create \
            --resource-group ${{ vars.RESOURCE_GROUP }}\
            --template-file ./iac-adb-360/main.bicep \
            --parameters baseName=${{ vars.BASE_NAME }} env=${{ github.ref_name }}



